name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Buildozer & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses-dev libtinfo6 cmake libffi-dev libssl-dev lld libltdl-dev
          pip3 install --upgrade "setuptools<70" buildozer cython==0.29.36

            - name: Build Debug APK
        run: |
          (buildozer android debug > build.log 2>&1) || (tail -n 150 build.log | head -n 85 && exit 1)


      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xau-orb-bot-apk
          path: bin/*.apk
